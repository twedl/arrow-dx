[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arrow-dx"
version = "0.1.1"
description = "Helpers for the Arrow-backed Python stack: polars, pyarrow, duckdb."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "jesse tweedle" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "polars>=1.20",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]
pyarrow = ["pyarrow>=15"]
duckdb = ["duckdb>=1"]
all = ["arrow-dx[pandas,pyarrow,duckdb]"]
dev = ["pytest>=8", "pandas>=2", "pyarrow>=15", "duckdb>=1"]

[project.scripts]
arrow-dx = "arrow_dx.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arrow_dx"]
