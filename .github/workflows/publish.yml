name: publish

# Build pure-python sdist + wheel and publish to PyPI.
# Triggers:
#   - push of a tag matching v* (e.g. v0.1.1)
#   - manual workflow_dispatch
#
# Authentication: PyPI Trusted Publishing (OIDC). Configure on PyPI under
# Manage project → Publishing, with workflow `publish.yml` and environment `pypi`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: install build
        run: python -m pip install --upgrade build

      - name: build
        run: python -m build

      - name: list dist
        run: ls -lh dist/

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    name: publish to pypi
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/arrow-dx
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: list dist
        run: ls -lh dist/

      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
